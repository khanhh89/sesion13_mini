name: CI/CD Campus Hub

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  DOCKERHUB_BACKEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/campus-hub-backend
  DOCKERHUB_FRONTEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/campus-hub-frontend

jobs:
  test:
    name: Test (CI)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Test Backend
        run: |
          cd backend
          chmod +x gradlew
          ./gradlew test

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Lint & Build Frontend
        run: |
          cd frontend
          npm ci
          npm run lint
          npm run build

  build-and-push:
    name: Build & Push Docker Images
    needs: test
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.DOCKERHUB_BACKEND_IMAGE }}:latest
            ${{ env.DOCKERHUB_BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.DOCKERHUB_FRONTEND_IMAGE }}:latest
            ${{ env.DOCKERHUB_FRONTEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS (CD)
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT || 22 }}
          passphrase: ${{ secrets.VPS_PASSPHRASE }}
          script: |
            mkdir -p ~/campus-hub && cd ~/campus-hub

            # Pull latest images from Docker Hub
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/campus-hub-backend:latest
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/campus-hub-frontend:latest

            # Create .env
            echo "DB_NAME=campus_hub" > .env
            echo "DB_USERNAME=root" >> .env
            echo "DB_PASSWORD=123456" >> .env
            echo "CORS_ALLOWED_ORIGINS=*" >> .env

            # Create docker-compose.yml
            cat << 'EOF' > docker-compose.yml
services:
  mysql:
    image: mysql:8.0
    container_name: campus-hub-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: campus_hub
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p123456"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - campus-network

  backend:
    image: BACKEND_IMAGE_TAG
    container_name: campus-hub-backend
    restart: unless-stopped
    environment:
      DB_URL: jdbc:mysql://mysql:3306/campus_hub?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      DB_USERNAME: root
      DB_PASSWORD: 123456
      SERVER_PORT: 8080
      CORS_ALLOWED_ORIGINS: "*"
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:8080"
    networks:
      - campus-network

  frontend:
    image: FRONTEND_IMAGE_TAG
    container_name: campus-hub-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - campus-network

volumes:
  mysql_data:

networks:
  campus-network:
    driver: bridge
EOF

            sed -i "s|BACKEND_IMAGE_TAG|${{ secrets.DOCKERHUB_USERNAME }}/campus-hub-backend:latest|g" docker-compose.yml
            sed -i "s|FRONTEND_IMAGE_TAG|${{ secrets.DOCKERHUB_USERNAME }}/campus-hub-frontend:latest|g" docker-compose.yml

            # Restart services
            docker compose down || true
            docker compose up -d

            # Verify
            sleep 5
            docker compose ps

